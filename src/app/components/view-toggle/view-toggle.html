<div class="inline-flex items-center p-1 bg-slate-100/90 rounded-xl border border-slate-200">
  <button
    type="button"
    (click)="selectView('task')"
    class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold transition-all duration-150 cursor-pointer"
    [class.bg-white]="activeView() === 'task'"
    [class.text-indigo-600]="activeView() === 'task'"
    [class.shadow-sm]="activeView() === 'task'"
    [class.text-slate-600]="activeView() !== 'task'"
    [class.hover:text-slate-900]="activeView() !== 'task'"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
    </svg>
    Projets & Tâches
  </button>

  <button
    type="button"
    (click)="selectView('user')"
    class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold transition-all duration-150 cursor-pointer"
    [class.bg-white]="activeView() === 'user'"
    [class.text-indigo-600]="activeView() === 'user'"
    [class.shadow-sm]="activeView() === 'user'"
    [class.text-slate-600]="activeView() !== 'user'"
    [class.hover:text-slate-900]="activeView() !== 'user'"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
    </svg>
    Membres
  </button>
</div>
