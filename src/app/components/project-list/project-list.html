<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
  <!-- En-tête de section et Barre de recherche -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">
    <div>
      <h2 class="text-2xl font-bold text-slate-900 tracking-tight flex items-center gap-3">
        Tous les Projets
        <span class="text-xs px-2.5 py-0.5 rounded-full font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200">
          {{ filteredProjects().length }}
        </span>
      </h2>
      <p class="text-sm text-slate-500 mt-1">Avancement global, répartition budgétaire et suivi des tâches</p>
    </div>

    <!-- Barre de recherche moderne -->
    <div class="relative w-full md:w-80">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35m1.35-5.65a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
      <input
        type="text"
        placeholder="Rechercher un projet..."
        [(ngModel)]="searchQuery"
        class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-white border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm shadow-xs transition-all"
      />
    </div>
  </div>

  <!-- Grille responsive -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    @for (project of filteredProjects(); track project.id) {
      <app-project-card
        [project]="project"
        (projectSelected)="onProjectSelected($event)"
      />
    } @empty {
      <div class="col-span-full py-16 text-center bg-white rounded-2xl border border-dashed border-slate-300 p-8">
        <div class="h-12 w-12 mx-auto rounded-full bg-slate-100 flex items-center justify-center text-slate-400 mb-3">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <p class="text-base font-semibold text-slate-700">Aucun projet trouvé</p>
        <p class="text-sm text-slate-500 mt-1">Essayez un autre mot-clé de recherche</p>
      </div>
    }
  </div>
</div>
