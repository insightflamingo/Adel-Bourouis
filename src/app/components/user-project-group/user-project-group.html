<div class="space-y-4">
  @for (group of projectGroups(); track group.projectId) {
    <div class="bg-slate-50/70 rounded-xl border border-slate-200 p-4 sm:p-5 space-y-3">
      <!-- En-tête : Nom du projet, statut et nombre de tâches -->
      <div class="flex items-start justify-between gap-3 pb-3 border-b border-slate-200/80">
        <!-- Titre du projet -->
        <div class="flex items-center gap-2 min-w-0">
          <span class="h-2 w-2 rounded-full bg-indigo-600 shrink-0"></span>
          <h4 class="text-sm font-bold text-slate-900 tracking-tight truncate">
            {{ group.projectName }}
          </h4>
        </div>

        <!-- Badges d'information (groupés à droite, sans retour à la ligne) -->
        <div class="flex items-center gap-2 shrink-0">
          <!-- Statut du projet -->
          <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-medium bg-white text-slate-600 border border-slate-200/90 whitespace-nowrap shadow-xs">
            {{ group.projectStatus }}
          </span>

          <!-- Compteur de tâches -->
          <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold bg-indigo-50 text-indigo-700 border border-indigo-100 whitespace-nowrap">
            {{ group.taskCount }}&nbsp;tâche{{ group.taskCount > 1 ? 's' : '' }}
          </span>
        </div>
      </div>

      <!-- Réutilisation de task-list avec assigné masqué -->
      <app-task-list
        [tasks]="group.tasks"
        [showAssignee]="false"
      />
    </div>
  } @empty {
    <div class="py-6 text-center text-sm text-slate-400 italic bg-slate-50 rounded-xl border border-dashed border-slate-200">
      Aucune tâche assignée
    </div>
  }
</div>
