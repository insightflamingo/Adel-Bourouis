<!-- Filtre des tâches -->
<div class="flex items-center gap-1 p-1 bg-slate-100 rounded-lg text-xs font-medium mb-3">
  <button
    type="button"
    (click)="setFilter('Toutes')"
    [class.bg-white]="statusFilter() === 'Toutes'"
    [class.text-indigo-600]="statusFilter() === 'Toutes'"
    [class.shadow-xs]="statusFilter() === 'Toutes'"
    [class.text-slate-600]="statusFilter() !== 'Toutes'"
    class="flex-1 py-1.5 px-2 rounded-md transition-all text-center cursor-pointer hover:text-indigo-600"
  >
    Toutes ({{ tasks().length }})
  </button>
  <button
    type="button"
    (click)="setFilter('En cours')"
    [class.bg-white]="statusFilter() === 'En cours'"
    [class.text-sky-600]="statusFilter() === 'En cours'"
    [class.shadow-xs]="statusFilter() === 'En cours'"
    [class.text-slate-600]="statusFilter() !== 'En cours'"
    class="flex-1 py-1.5 px-2 rounded-md transition-all text-center cursor-pointer hover:text-sky-600"
  >
    En cours ({{ inProgressCount() }})
  </button>
  <button
    type="button"
    (click)="setFilter('Terminé')"
    [class.bg-white]="statusFilter() === 'Terminé'"
    [class.text-emerald-600]="statusFilter() === 'Terminé'"
    [class.shadow-xs]="statusFilter() === 'Terminé'"
    [class.text-slate-600]="statusFilter() !== 'Terminé'"
    class="flex-1 py-1.5 px-2 rounded-md transition-all text-center cursor-pointer hover:text-emerald-600"
  >
    Terminées ({{ completedCount() }})
  </button>
</div>

<ul class="space-y-3">
  @for (task of filteredTasks(); track task.id) {
    <li>
      <app-task-item
        [task]="task"
        [showAssignee]="showAssignee()"
        [assigneeName]="getAssigneeName(task.assigneeId)"
        (taskStatusChange)="onTaskStatusChange(task.id, $event)"
        (taskDelete)="onTaskDelete($event)"
      />
    </li>
  } @empty {
    <li class="py-6 text-center text-sm text-slate-400 italic bg-slate-50 rounded-xl border border-dashed border-slate-200">
      @if (statusFilter() !== 'Toutes') {
        Aucune tâche avec le statut « {{ statusFilter() }} »
      } @else {
        Aucune tâche
      }
    </li>
  }
</ul>
