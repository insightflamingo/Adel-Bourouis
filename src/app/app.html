<div class="min-h-screen bg-slate-50/80 text-slate-900 font-sans antialiased">
  <!-- Header / Navigation -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200/80 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <!-- Logo et titre -->
      <div class="flex items-center gap-4">
        <div class="h-11 w-11 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
          TF
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">
            {{ title() }}
          </h1>
          <p class="text-xs text-slate-500 font-medium">Gestion collaborative des projets & équipes</p>
        </div>
      </div>

      <!-- Basculement de vue générique -->
      <div>
        <app-view-toggle [(activeView)]="currentView" />
      </div>
    </div>
  </header>

  <!-- Contenu principal -->
  <main class="py-8">
    @if (currentView() === 'task') {
      <app-project-list />
    } @else {
      <app-user-list />
    }
  </main>
</div>
